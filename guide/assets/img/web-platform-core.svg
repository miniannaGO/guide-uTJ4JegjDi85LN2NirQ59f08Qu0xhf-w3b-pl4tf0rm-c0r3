<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="web-platform-core-logo-title">
  <title id="web-platform-core-logo-title">Web Platform Core</title>
  <defs>
    <linearGradient id="chip-fill" x1="112" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#403e41" />
      <stop offset="1" stop-color="#19181a" />
    </linearGradient>
    <linearGradient id="chip-tint" x1="116" y1="108" x2="398" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd866" stop-opacity="0.18" />
      <stop offset="1" stop-color="#78dce8" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="chip-border" x1="82" y1="82" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd866" stop-opacity="0.78" />
      <stop offset="0.56" stop-color="#78dce8" stop-opacity="0.72" />
      <stop offset="1" stop-color="#ff6188" stop-opacity="0.56" />
    </linearGradient>
    <filter id="chip-shadow" x="36" y="34" width="440" height="444" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#78dce8" flood-opacity="0.12" />
    </filter>
    <mask id="chip-cutout">
      <rect width="512" height="512" fill="#000" />
      <rect x="76" y="76" width="360" height="360" rx="104" fill="#fff" />
      <rect x="126" y="158" width="266" height="196" rx="58" fill="#000" />
    </mask>
  </defs>

  <g filter="url(#chip-shadow)">
    <rect x="76" y="76" width="360" height="360" rx="104" fill="url(#chip-fill)" mask="url(#chip-cutout)" />
    <rect x="76" y="76" width="360" height="360" rx="104" fill="url(#chip-tint)" mask="url(#chip-cutout)" />
    <rect x="80" y="80" width="352" height="352" rx="100" fill="none" stroke="url(#chip-border)" stroke-width="8" opacity="0.72" />
    <rect x="98" y="98" width="316" height="316" rx="82" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.1" />
  </g>

  <circle cx="162" cy="143" r="36" fill="#ffd866" />

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 158H328" stroke="#ffd866" stroke-width="28" opacity="0.82" />
    <path d="M392 220V292" stroke="#78dce8" stroke-width="28" opacity="0.76" />
    <path d="M330 158c34 0 62 28 62 62M392 292c0 34-28 62-62 62" stroke="#78dce8" stroke-width="28" opacity="0.28" />
    <path d="M370 354H185" stroke="#ff6188" stroke-width="28" opacity="0.72" />
  </g>

  <circle cx="369" cy="358" r="33" fill="#78dce8" />
</svg>
